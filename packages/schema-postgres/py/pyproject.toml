[project]
name = "boilpayment-schema-postgres"
version = "0.3.0"
description = "boilpayment — schema-postgres"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "boilpayment contributors" }]
requires-python = ">=3.11"
dependencies = ["boilpayment-core", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/schift-io/boilpayment#readme"
Repository = "https://github.com/schift-io/boilpayment.git"
Issues = "https://github.com/schift-io/boilpayment/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boilpayment_schema_postgres"]

# The sql/*.sql files live in the package directory as a COMMITTED copy of the monorepo's
# packages/schema-postgres/sql (source of truth), synced by scripts/sync-sql.mjs and drift-checked
# by tests/test_sql_sync.py. A `force-include "../sql"` cannot work here: `uv build` builds the
# wheel from the sdist, where a path above the package root does not exist.
