[project]
name = "boilpayment"
version = "0.2.0"
description = "boilpayment — single-install facade re-exporting every boilpayment-* distribution via submodules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "boilpayment contributors" }]
requires-python = ">=3.11"
dependencies = [
  "boilpayment-core==0.2.0",
  "boilpayment-credits==0.2.0",
  "boilpayment-lifecycle==0.2.0",
  "boilpayment-refund==0.2.0",
  "boilpayment-usage==0.2.0",
  "boilpayment-webhook==0.2.0",
  "boilpayment-notify==0.2.0",
  "boilpayment-cs==0.2.0",
  "boilpayment-schema-postgres==0.2.0",
  "boilpayment-stripe==0.2.0",
  "boilpayment-toss==0.2.0",
  "boilpayment-portone==0.2.0",
  "boilpayment-polar==0.2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/schift-io/boilpayment#readme"
Repository = "https://github.com/schift-io/boilpayment.git"
Issues = "https://github.com/schift-io/boilpayment/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boilpayment"]
