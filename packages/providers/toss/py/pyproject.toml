[project]
name = "schift-payment-kit-toss"
version = "0.1.0"
description = "Schift Payment Kit — toss"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Schift" }]
requires-python = ">=3.11"
dependencies = ["schift-payment-kit-core", "httpx>=0.27"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/schift-io/payment-kit#readme"
Repository = "https://github.com/schift-io/payment-kit.git"
Issues = "https://github.com/schift-io/payment-kit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schift_payment_kit_toss"]
