[project]
name = "boilpayment-monorepo"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "boilpayment-core",
  "boilpayment-credits",
  "boilpayment-usage",
  "boilpayment-lifecycle",
  "boilpayment-refund",
  "boilpayment-webhook",
  "boilpayment-notify",
  "boilpayment-cs",
  "boilpayment-schema-postgres",
  "boilpayment-stripe",
  "boilpayment-polar",
  "boilpayment-toss",
  "boilpayment-portone",
  "boilpayment",
]

[project.urls]
Homepage = "https://github.com/schift-io/boilpayment#readme"
Repository = "https://github.com/schift-io/boilpayment.git"
Issues = "https://github.com/schift-io/boilpayment/issues"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/*/py",
  "packages/providers/*/py",
]

[tool.uv.sources]
boilpayment-core = { workspace = true }
boilpayment-credits = { workspace = true }
boilpayment-usage = { workspace = true }
boilpayment-lifecycle = { workspace = true }
boilpayment-refund = { workspace = true }
boilpayment-webhook = { workspace = true }
boilpayment-notify = { workspace = true }
boilpayment-cs = { workspace = true }
boilpayment-schema-postgres = { workspace = true }
boilpayment-stripe = { workspace = true }
boilpayment-polar = { workspace = true }
boilpayment-toss = { workspace = true }
boilpayment-portone = { workspace = true }
boilpayment = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
