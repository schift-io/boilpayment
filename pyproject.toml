[project]
name = "schift-payment-kit-monorepo"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "schift-payment-kit-core",
  "schift-payment-kit-credits",
  "schift-payment-kit-usage",
  "schift-payment-kit-lifecycle",
  "schift-payment-kit-refund",
  "schift-payment-kit-webhook",
  "schift-payment-kit-notify",
  "schift-payment-kit-cs",
  "schift-payment-kit-schema-postgres",
  "schift-payment-kit-stripe",
  "schift-payment-kit-polar",
  "schift-payment-kit-toss",
  "schift-payment-kit-portone",
  "schift-payment-kit",
]

[project.urls]
Homepage = "https://github.com/schift-io/payment-kit#readme"
Repository = "https://github.com/schift-io/payment-kit.git"
Issues = "https://github.com/schift-io/payment-kit/issues"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/*/py",
  "packages/providers/*/py",
]

[tool.uv.sources]
schift-payment-kit-core = { workspace = true }
schift-payment-kit-credits = { workspace = true }
schift-payment-kit-usage = { workspace = true }
schift-payment-kit-lifecycle = { workspace = true }
schift-payment-kit-refund = { workspace = true }
schift-payment-kit-webhook = { workspace = true }
schift-payment-kit-notify = { workspace = true }
schift-payment-kit-cs = { workspace = true }
schift-payment-kit-schema-postgres = { workspace = true }
schift-payment-kit-stripe = { workspace = true }
schift-payment-kit-polar = { workspace = true }
schift-payment-kit-toss = { workspace = true }
schift-payment-kit-portone = { workspace = true }
schift-payment-kit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
